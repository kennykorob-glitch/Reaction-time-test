<style>

</style></head><body><div id="a"></div><script>
var $=document.getElementById('a'),HAND=['Правая рука','Левая рука'],LIM={prep:[3,10],yel:[1,10],tmo:[1,30],dist:[1,30]};

async function initMic(){

/* ---- экраны ---- */
function modal(h,t,ok){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="card"><h3>'+h+'</h3>'+t+'<div class="row" style="margin-top:6px">'+(ok?'<button class="main" id="mo">Удалить</button>':'')+'<button id="mc">'+(ok?'Отмена':'Понятно')+'</button></div></div>';document.body.appendChild(o);
 o.querySelector('#mc').onclick=function(){o.remove()};if(ok)o.querySelector('#mo').onclick=function(){o.remove();ok()}}
function info(){modal('Как это работает','<p>Приложение слушает микрофон и измеряет, за сколько секунд после зелёного сигнала нож попал в мишень — по звуку удара.</p><p><b>Цикл:</b> красный сигнал с обратным отсчётом (подготовка), затем жёлтая фаза случайной длительности (ждите без отсчёта) и зелёный «Бросок». Время от зелёного сигнала до звука попадания записывается. Нет звука за время ожидания — промах. Циклы идут сами, пока вы не нажмёте «Закончить» или не коснётесь цветного экрана.</p><p><b>Калибровка:</b> нажмите «Калибровка», бросьте нож в мишень (можно несколько раз) и нажмите «Завершить». Самый громкий звук станет эталоном удара, порог чувствительности подберётся сам. Громкий посторонний звук может быть принят за попадание.</p><p><b>Настройки:</b> подготовка — секунды красного отсчёта; жёлтая — максимум случайной паузы; ждать удар — сколько секунд после «Броска» ждать звук.</p><p>Метайте только на безопасной оборудованной площадке.</p>')}
function head(t,back,right){return'<div class="hd">'+(back?'<button class="sq" data-c="'+back+'">‹</button>':'')+'<h1>'+t+'</h1>'+(right||'')+'</div>'}

function chg(k,d){var v=Math.max(LIM[k][0],Math.min(LIM[k][1],cfg[k]+d));if(v==cfg[k])return;cfg[k]=v;sv('kr_cfg',cfg);var e=document.getElementById('v_'+k);if(e)e.innerHTML=v+(k=='dist'?' <small>м</small>':'')}

 +'<div class="row">'+stp('prep','Подготовка, сек')+stp('yel','Жёлтая, до сек')+'</div><div class="row">'+stp('tmo','Ждать, сек')+stp('dist','Дистанция')+'</div>'
 +'<div class="card"><h2>Рука</h2><div class="seg">'+['Правая','Левая'].map(function(n,i){return'<button class="'+(cfg.hand==i?'on':'')+'" data-c="cfg.hand='+i+';sv(\'kr_cfg\',cfg);draw()">'+n+'</button>'}).join('')+'</div></div>'
 +'<div class="card"><h2>Микрофон</h2><div class="lv"><i id="lv"></i></div><div class="st '+micK+'" id="st">'+esc(micMsg)+'</div><button style="width:100%" class="'+(calib?'on':'')+'" data-c="calibrate()">'+(calib?'Завершить калибровку':'Калибровка')+'</button></div>'
 +'<button class="main go" data-c="start()">Начать тренировку</button>'}
function runV(){return'<div class="card" style="padding:6px"><div class="sum"><div><b class="win" id="rk">'+run.k+'</b><span>попытка</span></div><div><b class="win" id="rl">—</b><span>последнее, с</span></div><div><b class="win" id="ra">—</b><span>среднее, с</span></div></div></div><div class="sigw" data-pd="stop()"><div class="sig red" id="sg"><div class="n" id="sn">'+run.prep+'</div></div><div class="l" id="sl">Приготовьтесь</div></div><button data-c="stop()">Закончить тренировку</button>'}
function sig(c,b,l){var m=document.getElementById('sg');if(!m)return;m.className='sig '+c;document.body.className='p-'+c;var n=document.getElementById('sn');n.textContent=b;n.className='n'+(/^\d+$/.test(b)?'':' w');document.getElementById('sl').textContent=l}

 starting=false;run={tok:0,hand:cfg.hand|0,dist:cfg.dist,prep:cfg.prep,yel:cfg.yel,tmo:cfg.tmo,thr:Math.max(cfg.thr,noise*2.5),k:0,n:0,hits:0,ts:[]};

/* ---- статистика ---- */
function cmap(A){var d=[];A.forEach(function(x){if(d.indexOf(x.dist)<0)d.push(x.dist)});d.sort(function(a,b){return a-b});var m={};d.forEach(function(k,i){m[k]='var(--c'+(i%4+1)+')'});return m}
function chart(A,CM){var W=320,H=150,pl_=38,iw=W-pl_-8,ih=H-18,o='',S=A.filter(function(x){return ts(x).length}).sort(function(a,b){return a.d-b.d}),G={},ds=[],L=1,mx=0;
