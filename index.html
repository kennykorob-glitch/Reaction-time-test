/* Тема оформления: «как в системе» / тёмная / светлая. Выбор хранится в localStorage (kr_theme). */
(function(){var d=document.documentElement,mq=null,memP=null;try{mq=window.matchMedia('(prefers-color-scheme: light)')}catch(e){}
function pref(){var v=null;try{v=localStorage.getItem('kr_theme')}catch(e){}if(v===null)v=memP;return v==='light'||v==='dark'?v:'system'}
function apply(){var p=pref(),t=p==='system'?(mq&&mq.matches?'light':'dark'):p;d.setAttribute('data-theme',t);
 var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0b0b0c':'#f4f4ef')}
window.themePref=pref;window.themeNow=function(){return d.getAttribute('data-theme')||'dark'};
window.setTheme=function(v){v=v==='light'||v==='dark'?v:'system';memP=v;try{if(v==='system')localStorage.removeItem('kr_theme');else localStorage.setItem('kr_theme',v)}catch(e){}apply()};
if(mq){var f=function(){if(pref()==='system')apply()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}
apply()})();
