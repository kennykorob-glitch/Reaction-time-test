function f2(x){return(Math.round(x*100)/100).toFixed(2).replace('.',',')}function f1(x){return String(Math.round(x*10)/10).replace('.',',')}

 return'<svg viewBox="0 0 200 112" class="gg"><path d="M6 104A94 94 0 0 1 194 104Z" fill="#e9dda8" stroke="#15170f" stroke-width="4"/>'+t+'<text x="100" y="86" text-anchor="middle" font-size="9" letter-spacing="2" fill="#2a2410">УРОВЕНЬ</text><g id="'+id+'" class="nd '+(cl||'')+'"><line x1="100" y1="100" x2="100" y2="24" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/></g><circle cx="100" cy="100" r="7" fill="#1c1c18"/></svg>'}

function info(){modal('Как это работает','<p>Приложение слушает микрофон и измеряет, за сколько секунд после зелёного сигнала нож попал в мишень — по звуку удара.</p><p><b>Цикл:</b> красный сигнал с обратным отсчётом (подготовка), затем жёлтая фаза случайной длительности (ждите без отсчёта) и зелёный «Бросок». Время от зелёного сигнала до звука попадания записывается. Нет звука за время ожидания — промах. Циклы идут сами, пока вы не нажмёте «Закончить» или не коснётесь цветного экрана.</p><p><b>Калибровка:</b> нажмите «Калибровка», бросьте нож в мишень (можно несколько раз) и нажмите «Завершить». Самый громкий звук станет эталоном удара, порог чувствительности подберётся сам. Громкий посторонний звук может быть принят за попадание.</p><p><b>Настройки:</b> подготовка — секунды красного отсчёта; жёлтая — максимум случайной паузы; ждать удар — сколько секунд после «Броска» ждать звук.</p><p>Метайте только на безопасной оборудованной площадке.</p>')}

async function cycle(r){
 if(run!==r)return;var t=++r.tok;r.k++;live();
 for(var n=r.prep;n>0;n--){sig('red',String(n),'Приготовьтесь');if(!await W(1000,r,t))return}
 sig('yel','●','Ожидайте сигнал');
 if(!await W(1000+Math.random()*(Math.max(1,r.yel)*1000-1000),r,t))return;
 var g=performance.now(),end=g+r.tmo*1000,hit=0;sig('green','БРОСОК','Зелёный сигнал');vib(120);
 while(run===r&&r.tok===t&&performance.now()<end){
  var now=performance.now();
  if(now-g>120&&rms()>r.thr){hit=1;var s=(now-g)/1000;r.n++;r.hits++;r.ts.push(s);sig('res',f2(s)+' с','Попадание зафиксировано');live();vib(60);if(!await W(1300,r,t))return;break}
  await new Promise(function(q){setTimeout(q,12)})}
 if(run!==r||r.tok!==t)return;
 if(!hit){r.n++;sig('miss','ВРЕМЯ','Попадание не зафиксировано');if(!await W(700,r,t))return}
 cycle(r)}
function stop(){var r=run;if(!r)return;run=null;TM.forEach(clearTimeout);TM=[];try{lock&&lock.release()}catch(e){}lock=null;freeMic();
 if(r.n>0){result={d:Date.now(),hand:r.hand,dist:r.dist,n:r.n,hits:r.hits,ts:r.ts.map(function(x){return Math.round(x*1000)/1000})};hist.push(result);sv('kr_hist',hist);sHand=r.hand;scr='saved'}else scr='setup';draw()}
function saved(){var r=result,t=ts(r),pc=r.n?r.hits*100/r.n:0;
 return head('Сохранено','')+'<div class="card" style="margin:auto 0"><div style="color:var(--mut)">'+HAND[r.hand]+' · '+r.dist+' м · '+fd(new Date(r.d))+'</div><div class="win" style="font-size:50px;margin:8px 0">'+(t.length?f2(avg(t))+' <small style="font-size:24px">с</small>':'—')+'</div><div style="color:var(--mut)">среднее время реакции · попаданий '+Math.round(pc)+'%</div><div class="bar" style="margin:8px 0"><i style="width:'+pc+'%"></i></div><div class="sum"><div><b>'+r.hits+'</b><span>попал</span></div><div><b>'+(r.n-r.hits)+'</b><span>мимо</span></div><div><b>'+(t.length?f2(Math.min.apply(null,t)):'—')+'</b><span>лучшее, с</span></div></div></div><button class="main go" data-c="start()">Ещё раз</button><button data-c="stats()">К статистике</button><button data-c="go(\'setup\')">К настройкам</button>'}
/* ---- статистика ---- */
function cmap(A){var d=[];A.forEach(function(x){if(d.indexOf(x.dist)<0)d.push(x.dist)});d.sort(function(a,b){return a-b});var m={};d.forEach(function(k,i){m[k]='var(--c'+(i%4+1)+')'});return m}
function chart(A,CM){var W=320,H=150,pl_=38,iw=W-pl_-8,ih=H-18,o='',S=A.filter(function(x){return ts(x).length}).sort(function(a,b){return a.d-b.d}),G={},ds=[],L=1,mx=0;
 if(!S.length)return'<div style="padding:8px 0;color:var(--mut)">Нет попаданий в сохранённых тренировках.</div>';
 S.forEach(function(x){var k=x.dist;if(!G[k]){G[k]=[];ds.push(k)}G[k].push(avg(ts(x)))});ds.sort(function(a,b){return a-b});
 ds.forEach(function(k){G[k]=G[k].slice(-10);L=Math.max(L,G[k].length);mx=Math.max(mx,Math.max.apply(null,G[k]))});
 var hi=Math.max(.2,Math.ceil(mx*1.15*10)/10),Y=function(v){return 10+ih-ih*v/hi},st=L>1?(iw-20)/(L-1):0;
 [0,hi/2,hi].forEach(function(v){var y=Y(v);o+='<line x1="'+pl_+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'" stroke="#cfd4bf" stroke-opacity=".25" stroke-dasharray="3 3"/><text x="'+(pl_-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#cfd4bf">'+f2(v)+'</text>'});
 ds.forEach(function(k){var pts=G[k].map(function(v,j){return[pl_+10+j*st,Y(v)]});if(pts.length>1)o+='<polyline fill="none" stroke-width="3" stroke-linejoin="round" style="stroke:'+CM[k]+'" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';pts.forEach(function(p){o+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" style="fill:'+CM[k]+'"/>'})});
 return'<div class="glass"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+o+'</svg></div><div class="lg">'+ds.map(function(k){return'<span><i style="background:'+CM[k]+'"></i>'+k+' м</span>'}).join('')+'</div><div style="font-size:12px;color:var(--mut);margin:2px 0 6px">Последние 10 тренировок на каждой дистанции. Чем ниже время, тем лучше</div>'}
function statsV(){var h=head('Статистика','go(\'setup\')'),A=hist.filter(function(x){return(x.hand|0)==sHand});
 h+='<div class="tabs">'+HAND.map(function(n,i){return'<button class="'+(sHand==i?'on':'')+'" data-c="sHand='+i+';draw()">'+n+'</button>'}).join('')+'</div>';
 if(!A.length)return h+'<div class="card" style="color:var(--mut)">Для этой руки пока нет сохранённых тренировок.</div>';
 var CM=cmap(A),D={},ds=[];A.forEach(function(x){if(!D[x.dist]){D[x.dist]=[];ds.push(x.dist)}D[x.dist].push(x)});ds.sort(function(a,b){return a-b});
 h+='<div class="card"><h2>Динамика реакции, с</h2>'+chart(A,CM);
 ds.forEach(function(k){var t=[];D[k].forEach(function(x){t=t.concat(ts(x))});h+='<div class="ac"><i class="d" style="background:'+CM[k]+'"></i><div><b style="font-size:16px;text-align:left">'+k+' м</b><span>'+pl(D[k].length,['тренировка','тренировки','тренировок'])+' · лучшее '+(t.length?f2(Math.min.apply(null,t))+' с':'—')+'</span></div><b>'+(t.length?f2(avg(t))+' с':'—')+'<span style="text-align:right">сред. время</span></b></div>'});
 h+='</div><div class="card"><h2>История</h2>';
 A.slice().reverse().slice(0,300).forEach(function(x){var d=new Date(x.d),t=ts(x);h+='<div class="hr"><div>'+fd(d)+'<span>'+p2(d.getHours())+':'+p2(d.getMinutes())+'</span></div><div>'+pl(x.n,['попытка','попытки','попыток'])+'<span>'+x.dist+' м · '+(x.hand?'Л':'П')+'</span></div><b>'+(t.length?f2(avg(t))+' с':'—')+'</b><button data-c="del('+x.d+')">✕</button></div>'});
 return h+'<button style="margin-top:8px;width:100%" data-c="clr()">Удалить всю историю ('+HAND[sHand].toLowerCase()+')</button></div>'}
function del(d){modal('Удалить тренировку?','<p>Это нельзя отменить.</p>',function(){hist=hist.filter(function(h){return h.d!=d});sv('kr_hist',hist);draw()})}
function clr(){modal('Удалить всю историю?','<p>'+HAND[sHand]+'. Это нельзя отменить.</p>',function(){hist=hist.filter(function(x){return(x.hand|0)!=sHand});sv('kr_hist',hist);draw()})}
/* ---- навигация ---- */
function stats(){stopCal();freeMic();scr='stats';sHand=cfg.hand|0;draw()}
function go(s){stopCal();if(s=='setup')freeMic();scr=s;draw()}
function draw(){$.innerHTML=scr=='splash'?'<div class="sp"><div class="gw">'+gauge('sw0','sw')+'</div><h1>На реакцию</h1><p>Тренировка метания ножей</p><div class="ls"><i></i><i></i><i></i></div></div>':scr=='run'?runV():scr=='saved'?saved():scr=='stats'?statsV():setup();
 $.scrollTop=0;if(scr=='run')live();if(an&&!run)meter()}
document.addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(b)eval(b.dataset.c)});
document.addEventListener('pointerdown',function(e){var p=e.target.closest('[data-pd]');if(p)return eval(p.dataset.pd);var b=e.target.closest('button[data-k]');if(!b)return;var k=b.dataset.k,d=+b.dataset.d;chg(k,d);clearTimeout(b._t);b._t=setTimeout(function(){b._i=setInterval(function(){chg(k,d)},90)},420)});
['pointerup','pointercancel','pointerleave'].forEach(function(n){document.addEventListener(n,function(e){var b=e.target.closest&&e.target.closest('button[data-k]');if(b){clearTimeout(b._t);clearInterval(b._i)}},true)});
window.addEventListener('pagehide',freeMic);
draw();setTimeout(function(){if(scr=='splash')go('setup')},1800);
</script></body></html>
