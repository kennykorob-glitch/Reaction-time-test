<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><title>На реакцию</title>
<style>
:root{--ac:#e8ff3a;--ink:#f2f2ee;--mut:#7d7d79;--ln:#26262a;--c1:#e8ff3a;--c2:#ff5a3c;--c3:#4da3ff;--c4:#c58bff;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500;color:var(--ink);background:#0b0b0c;overflow:hidden;transition:background .12s}
body.p-red{background:#ff2d20}body.p-yel{background:#ffb800;color:#15110a}body.p-green{background:#17d45c;color:#04170a}body.p-res{background:#f2f2ee;color:#0b0b0c}body.p-miss{background:#2a2a2e}
#a{height:100%;max-width:540px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:4px}
h1{flex:1;margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}h1:after{content:".";color:var(--ac)}
h2{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
button{font:inherit;font-size:13px;font-weight:600;color:inherit;min-height:52px;padding:8px 18px;border:1px solid #3a3a3e;border-radius:999px;text-transform:uppercase;letter-spacing:.14em;background:none;cursor:pointer;transition:background .12s}
button:active{background:rgba(255,255,255,.1)}
button.main{border-color:#55555a}
button.go{background:var(--ac);color:#0b0b0c;border:0;font-weight:800;font-size:15px;min-height:58px}button.go:active{background:#cfe62f}
button.on{background:var(--ink);color:#0b0b0c;border-color:var(--ink)}
body[class^=p-] button{border-color:currentColor}
.sq{width:42px;min-height:42px;padding:0;font-size:18px;letter-spacing:0;text-transform:none}
.card{border-top:1px solid var(--ln);padding:12px 0 6px}
.row{display:flex;gap:0}.row>*{flex:1 1 0;min-width:0}.row>.card+.card{border-left:1px solid var(--ln);padding-left:16px;margin-left:16px}
.win{flex:1;text-align:center;font:700 34px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}.win
